name: examples

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: skill examples compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness/.build

      - name: Self-test the checker
        run: python3 harness/selftest.py

      - name: Check skill examples
        run: python3 harness/check_examples.py

  pin:
    name: redactable pin is current
    runs-on: ubuntu-latest
    # The example check pins an exact version, so it cannot notice a new
    # release on its own. This is the signal that the pin has fallen behind.
    # It is advisory: a new release does not mean the skills are wrong yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Compare the pin against crates.io
        run: python3 harness/check_examples.py --check-latest
