name: examples

on:
  push:
    branches: [main]
  pull_request:
  # Catches drift from a new redactable release even when nothing here changed.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    name: skill examples compile and run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness/.build

      - name: Self-test the checker
        run: python3 harness/selftest.py

      - name: Check skill examples
        run: python3 harness/check_examples.py
